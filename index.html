<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>취업 수첩</title>
<meta name="description" content="지원 현황, 캘린더, 경험 정리, 자소서, 스펙, 면접 준비를 한곳에서 관리하는 취업 준비 앱">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="취업 수첩">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: app shell — grouped sidebar on desktop, thumb-reach bottom bar on phones; one calm accent, state carried by small dots */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F0F2F5; --ink:#1E2329; --ink-2:#56606C; --ink-3:#8A929D; --line:#E2E5EA;
  --accent:#3E59CF; --accent-ink:#2D44A8; --accent-soft:#ECEFFB; --on-accent:#FFFFFF;
  --due:#C8463B; --due-soft:#FBEDEB; --stage:#A86B12; --stage-soft:#FAF2E3; --ok:#2E8659; --ok-soft:#E6F3EC;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161A; --surface:#1C1F25; --surface-2:#252930; --ink:#E7E9EC; --ink-2:#A8AFB9; --ink-3:#7D8590; --line:#2F333B;
  --accent:#8FA2F5; --accent-ink:#AEBBF8; --accent-soft:#262D48; --on-accent:#14161A;
  --due:#EE8379; --due-soft:#3A2526; --stage:#E0AE5C; --stage-soft:#3A3021; --ok:#6CC596; --ok-soft:#1F3328;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161A; --surface:#1C1F25; --surface-2:#252930; --ink:#E7E9EC; --ink-2:#A8AFB9; --ink-3:#7D8590; --line:#2F333B;
  --accent:#8FA2F5; --accent-ink:#AEBBF8; --accent-soft:#262D48; --on-accent:#14161A;
  --due:#EE8379; --due-soft:#3A2526; --stage:#E0AE5C; --stage-soft:#3A3021; --ok:#6CC596; --ok-soft:#1F3328;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html{font-size:16px} html[data-fs="s"]{font-size:14.5px} html[data-fs="l"]{font-size:17.5px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
.logo{font-size:1.15rem;font-weight:700;padding:0 10px;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp p{margin:0 0 4px;padding:0 10px;font-size:.72rem;font-weight:700;color:var(--ink-3);letter-spacing:.06em}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:9px 10px;border-radius:9px;color:var(--ink-2);font-size:.95rem;font-weight:500;text-align:left;width:100%;min-height:42px}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .cnt{margin-left:auto;font-size:.75rem;color:var(--ink-3)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--ink-3);padding:0 10px}
.main{min-width:0;padding-inline:32px;padding-block:28px 64px}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.mtop{display:none}
.bnav{display:none}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.ph h1{font-size:1.6rem}
.ph p{margin:4px 0 0;color:var(--ink-2);font-size:.92rem}
.sp{flex:1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:.85rem}

.btn{border:1px solid transparent;cursor:pointer;border-radius:9px;padding:.55rem .95rem;font-weight:500;font-size:.92rem;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;min-height:40px}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{background:var(--surface-2)}
.btn.txt{background:transparent;color:var(--accent);padding-inline:.5rem}
.btn.del{background:transparent;border-color:var(--line);color:var(--due)}
.btn.sm{padding:.3rem .65rem;font-size:.83rem;min-height:32px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px}
.ai-btn{background:var(--ink);color:var(--surface)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.55rem .75rem;min-height:40px}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;line-height:1.7}
select.in{cursor:pointer}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.8rem;font-weight:500;color:var(--ink-2)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:.35rem .8rem;border-radius:7px;cursor:pointer;font-size:.88rem;color:var(--ink-2);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .8rem;font-size:.85rem;cursor:pointer;color:var(--ink-2);min-height:34px}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-h h2{font-size:1.05rem}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--ink-2);font-size:.92rem;background:var(--surface)}
.banner{border-radius:var(--r);padding:12px 16px;font-size:.88rem;background:var(--stage-soft);color:var(--ink)}
.note{font-size:.82rem;color:var(--ink-3);margin:0}
.err{font-size:.85rem;color:var(--due);margin:0}

.st{display:inline-flex;align-items:center;gap:6px;font-size:.83rem;font-weight:500;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.dd{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.dd.hot{background:var(--due-soft);color:var(--due)}
.dd.warm{background:var(--stage-soft);color:var(--stage)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi span{font-size:.82rem;color:var(--ink-2)}
.kpi b{display:block;font-size:1.9rem;line-height:1.2;margin-top:4px}
.kpi small{color:var(--ink-3);font-size:.78rem}
.hgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;cursor:pointer;border-radius:0}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .date{font-size:.82rem;color:var(--ink-2)}
.li strong{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--ink-3);font-size:.8rem}
.kind{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.k-start{background:var(--accent)} .k-due{background:var(--due)} .k-stage{background:var(--stage)} .k-exam{background:var(--ok)} .k-personal{background:var(--ink-3)}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.82rem;color:var(--ink-2)}
.todo{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.todo>span{flex:1;min-width:0}
.todo.done>span{color:var(--ink-3);text-decoration:line-through}
.xbtn{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:1.1rem;line-height:1;min-height:32px}
.xbtn:hover{background:var(--surface-2);color:var(--due)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.step:hover{border-color:var(--accent)}
.step b{font-size:.78rem;color:var(--accent);font-weight:700}
.step strong{font-size:1.02rem}
.step span{font-size:.88rem;color:var(--ink-2)}

.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{font-size:1.2rem;min-width:7.5em;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .wd{font-size:.78rem;font-weight:500;color:var(--ink-3);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .wd.sun,.day.sun .dn{color:var(--due)}
.day{min-height:104px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;align-items:stretch;gap:3px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.day.out{background:var(--surface-2)} .day.out .dn{color:var(--ink-3)}
.day:hover{background:var(--surface-2)}
.day[aria-selected="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-size:.82rem;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--accent);color:var(--on-accent)}
.pill{font-size:.72rem;line-height:1.35;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.pill.k-start{background:var(--accent-soft);color:var(--accent-ink)}
.pill.k-due{background:var(--due-soft);color:var(--due)}
.pill.k-stage{background:var(--stage-soft);color:var(--stage)}
.pill.k-exam{background:var(--ok-soft);color:var(--ok)}
.pill.k-personal{background:var(--surface-2);color:var(--ink-2)}
.more{font-size:.72rem;color:var(--ink-3)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--ink-2);margin-top:12px}

.sumstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sumstrip div{padding:14px 18px;border-left:1px solid var(--line)}
.sumstrip div:first-child{border-left:0}
.sumstrip span{font-size:.8rem;color:var(--ink-2)}
.sumstrip b{display:block;font-size:1.45rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .in{max-width:240px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tr{display:grid;grid-template-columns:minmax(0,2fr) 140px minmax(0,1.2fr) 80px minmax(0,1.4fr) 74px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer}
.tr:first-child{border-top:0}
.tr.th{cursor:default;background:var(--surface-2);font-size:.78rem;font-weight:500;color:var(--ink-2);padding-block:9px}
.tr:not(.th):hover{background:var(--surface-2)}
.tr .co strong{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .co small{color:var(--ink-2);font-size:.83rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .cell{font-size:.86rem;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .mlabel{display:none}
.stsel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.3rem .5rem;font-size:.85rem;width:100%;cursor:pointer;min-height:36px}
.board-scroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:220px;gap:12px;min-width:max-content}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-size:.88rem;font-weight:700}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;width:100%}
.bcard:hover{border-color:var(--accent)}
.bcard strong{font-size:.92rem}
.bcard small{color:var(--ink-2);font-size:.8rem}

.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.kw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:5px 6px;background:var(--surface);min-height:40px}
.kw:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kw input{border:0;outline:0;flex:1;min-width:120px;padding:4px;background:transparent}
.kwchip{display:inline-flex;gap:2px;align-items:center;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:2px 4px 2px 10px;font-size:.85rem;font-weight:500}
.kwchip button{border:0;background:transparent;cursor:pointer;color:inherit;padding:0 5px;font-size:.95rem}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:.2rem .7rem;font-size:.8rem;cursor:pointer;color:var(--ink-2);min-height:30px}
.rec{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.rec h3{font-size:1rem}
.rec p{margin:0;font-size:.9rem;color:var(--ink-2)}
.co-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.35rem .75rem;font-size:.86rem;cursor:pointer;min-height:36px}
.co-btn:hover{border-color:var(--accent);color:var(--accent)}
.co-btn[data-added]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);cursor:default}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.posting{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.posting ul{margin:0;padding-left:18px;font-size:.86rem;color:var(--ink-2)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.88rem;padding:6px 0}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes pulse{from{opacity:.2}to{opacity:1}}
.aibox{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.aibox h4{font-size:.85rem;color:var(--accent-ink)}
.aibox ul{margin:4px 0 0;padding-left:18px}
.aibox p{margin:4px 0 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.story:hover{border-color:var(--accent)}
.story h3{font-size:1rem}
.story .per{font-size:.8rem;color:var(--ink-3)}
.star{display:flex;gap:4px}
.star span{font-size:.72rem;font-weight:700;width:24px;height:22px;display:grid;place-items:center;border-radius:5px;background:var(--surface-2);color:var(--ink-3)}
.star span.on{background:var(--accent-soft);color:var(--accent-ink)}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.idea p{margin:0;font-size:.86rem;color:var(--ink-2)}

.ess{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:16px;align-items:start}
.elist{display:flex;flex-direction:column;gap:4px}
.egrp{font-size:.75rem;font-weight:700;color:var(--ink-3);padding:10px 8px 2px;letter-spacing:.04em}
.eitem{text-align:left;cursor:pointer;background:transparent;border:0;border-radius:9px;padding:9px 10px;width:100%}
.eitem:hover{background:var(--surface)}
.eitem[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.eitem span{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem small{color:var(--ink-3);font-size:.76rem}
#e_body{min-height:360px;font-size:1rem;line-height:1.85}
.counter{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.85rem;color:var(--ink-2);align-items:center}
.counter b{color:var(--ink)}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex-basis:100%}
.bar div{height:100%;border-radius:999px;transition:width .2s}
.ref details{border-top:1px solid var(--line);padding:9px 0}
.ref summary{cursor:pointer;font-weight:500;font-size:.9rem}
.ref details p{margin:6px 0 0;font-size:.84rem;white-space:pre-wrap;color:var(--ink-2)}
.ref details p b{color:var(--ink)}

.spec{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 110px 150px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer}
.spec:first-child{border-top:0}
.spec:hover{background:var(--surface-2)}
.spec strong{font-weight:500}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.q p{margin:0}
.q .ans{font-size:.86rem;color:var(--ink-2);white-space:pre-wrap;max-height:5.4em;overflow:hidden}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.timer .t{font-size:2rem;font-weight:700;min-width:3.6ch}

.ov{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:40;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.2);display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h2{font-size:1.15rem}
.mb{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.mb h3{font-size:.85rem;color:var(--ink-2);font-weight:700;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.mb h3:first-child{border-top:0;padding-top:0;margin-top:0}
.mf{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 16px 16px}
.checks{display:flex;flex-wrap:wrap;gap:10px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer;min-height:28px}
.checks input{width:17px;height:17px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
.sheet{position:fixed;inset:0;z-index:45;background:rgba(15,20,30,.45);display:flex;align-items:flex-end}
.sheet-in{background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow-y:auto}

@media (max-width:1100px){.ess{grid-template-columns:200px minmax(0,1fr)}.ess .ref{grid-column:1/-1}.cal-wrap{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px;margin-bottom:4px}
  .mtop b{font-size:1.05rem}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--ink-3);padding:6px 0;cursor:pointer;min-height:52px}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--accent);font-weight:700}
  .ph h1{font-size:1.35rem}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hgrid,.two-col,.ess{grid-template-columns:1fr}
  .sumstrip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sumstrip div:nth-child(4){border-left:0}
  .sumstrip div:nth-child(n+4){border-top:1px solid var(--line)}
  .tr.th{display:none}
  .tr{grid-template-columns:minmax(0,1fr) 118px;gap:6px 10px;padding:14px 16px}
  .tr .co{grid-column:1;grid-row:1}
  .tr .stc{grid-column:2;grid-row:1}
  .tr .cell{grid-column:1;white-space:normal}
  .tr .cell.hide-m{display:none}
  .tr .mlabel{display:inline;color:var(--ink-3);margin-right:6px}
  .tr .ddc{grid-column:2;grid-row:2;justify-self:end}
  .spec{grid-template-columns:minmax(0,1fr) auto;padding:12px 16px}
  .spec .hide-m{display:none}
  .day{min-height:58px;padding:4px;align-items:center}
  .day .pill,.day .more{display:none}
  .dots{display:flex;justify-content:center}
  .steps{grid-template-columns:1fr}
  .ov{padding:0}
  .modal{border-radius:0;min-height:100%;max-width:none}
  .mf{border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}.toolbar .in{max-width:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="mtop" id="mtop"></div>
    <div class="page" id="view"></div>
  </div>
</div>
<nav class="bnav" id="bnav" aria-label="주요 메뉴"></nav>
<div id="modal-root"></div>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const IC={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 find:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 apps:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
 stories:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
 essays:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/>',
 specs:'<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/>',
 qs:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 left:'<path d="m15 6-6 6 6 6"/>', right:'<path d="m9 6 6 6-6 6"/>'
};
const ico=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const PAGES=[
 {grp:'',items:[{id:'home',label:'홈'},{id:'cal',label:'캘린더'}]},
 {grp:'지원 관리',items:[{id:'find',label:'공고 등록'},{id:'apps',label:'지원 현황'}]},
 {grp:'서류 준비',items:[{id:'stories',label:'경험 은행'},{id:'essays',label:'자소서'},{id:'specs',label:'스펙 관리'}]},
 {grp:'면접 준비',items:[{id:'qs',label:'면접 연습'}]},
 {grp:'',items:[{id:'settings',label:'설정·백업'}]},
];
const ALLP=PAGES.flatMap(g=>g.items);
const BNAV=['home','cal','apps','essays'];
const STATUS=[
 {k:'관심',c:'var(--ink-3)'},{k:'작성중',c:'var(--accent)'},{k:'지원완료',c:'var(--accent-ink)'},
 {k:'필기·인적성',c:'var(--stage)'},{k:'면접',c:'var(--stage)'},{k:'최종합격',c:'var(--ok)'},{k:'불합격',c:'var(--due)'},{k:'포기',c:'var(--ink-3)'}
];
const SK=STATUS.map(s=>s.k);
const ACTIVE=['관심','작성중','지원완료','필기·인적성','면접'];
const APPLIED=['지원완료','필기·인적성','면접','최종합격','불합격'];
const PASSED=['필기·인적성','면접','최종합격'];
const TAGS=['직무전문성','데이터분석','문제해결','리더십','협업','고객응대','도전·성장','AI·디지털','꼼꼼함','글로벌'];
const QCAT=['공통','직무','인성','회사별'];
const SPECK=['어학','자격증','학력','수상·활동','교육·수료'];
const DOCS=[['resume','이력서'],['essay','자소서'],['photo','증명사진'],['portfolio','포트폴리오'],['proof','성적·자격 증빙']];
const KIND={start:'접수 시작',due:'서류 마감',stage:'전형 일정',exam:'시험·스펙',personal:'개인 일정'};
const KORD=Object.keys(KIND);
const QUICK_KW=['SCM','구매','물류','생산관리','품질','영업관리','데이터분석','마케팅','인사','재무'];
const BASIC_QS=[
 ['1분 자기소개를 해 주세요.','공통'],['우리 회사에 지원한 이유는 무엇인가요?','공통'],['입사 후 이루고 싶은 목표는 무엇인가요?','공통'],
 ['마지막으로 하고 싶은 말이 있나요?','공통'],['이 직무에 필요한 역량은 무엇이고, 본인은 어떻게 준비했나요?','직무'],
 ['직무와 관련해 가장 성과가 컸던 경험을 말해 주세요.','직무'],['데이터를 활용해 문제를 해결한 경험이 있나요?','직무'],
 ['팀에서 갈등이 생겼을 때 어떻게 해결했나요?','인성'],['실패했던 경험과 그로부터 배운 점은?','인성'],
 ['본인의 장점과 단점은 무엇인가요?','인성'],['스트레스를 어떻게 관리하나요?','인성'],['상사와 의견이 다를 때 어떻게 하겠습니까?','인성']
];

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const arr=v=>Array.isArray(v)?v:[];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>iso(new Date());
const okDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const toD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function dday(s){if(!okDate(s))return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((toD(s)-n)/86400000)}
const ddLabel=n=>n===null?'':n===0?'D-DAY':n>0?`D-${n}`:`D+${-n}`;
const ddCls=n=>n===null||n<0?'':n<=3?'hot':n<=7?'warm':'';
const WD='일월화수목금토';
const md=s=>okDate(s)?`${+s.slice(5,7)}.${+s.slice(8,10)}`:'';
const mdw=s=>okDate(s)?`${md(s)} (${WD[toD(s).getDay()]})`:'';
const full=s=>okDate(s)?`${s.replace(/-/g,'.')} (${WD[toD(s).getDay()]})`:'';
const stOf=k=>STATUS.find(s=>s.k===k)||STATUS[0];
const stHtml=k=>`<span class="st" style="--c:${stOf(k).c}"><i></i>${esc(k||'관심')}</span>`;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};

/* ---------- store: server (per-person private) → this browser → memory ---------- */
const COLS=['apps','stories','essays','qs','specs','todos','events'];
const S={};COLS.forEach(c=>S[c]=[]);
let ai=null, aiOff=false, dl=null;
const Store={mode:'boot',base:null,LK:'jobnote_v2',
  async init(){
    const C=window.claude;let db=null,user=null;
    if(C&&C.use){[db,user,ai,dl]=await Promise.all(['db','user','sample','downloads'].map(n=>C.use(n).catch(()=>null)))}
    if(db&&user){
      const uid=await user.id().catch(()=>null);
      if(uid){try{
        const base=db.doc('data/users/'+uid+'/notebook');const m=await base.get();
        if(!m.exists)await base.set({created:Date.now()});
        this.base=base;this.mode='server';
      }catch(e){this.base=null}}
    }
    if(this.mode!=='server'){
      const data=lsGet(this.LK,null);
      this.mode=lsSet(this.LK+'_probe',1)?'local':'memory';
      if(data)COLS.forEach(c=>S[c]=arr(data[c]));
      render(true);return;
    }
    COLS.forEach(c=>this.base.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>toast('일부 데이터를 불러오지 못했어요. 새로고침해 주세요.')));
    render(true);
  },
  persist(){if(this.mode==='local'){const o={};COLS.forEach(c=>o[c]=S[c]);if(!lsSet(this.LK,o))toast('이 기기에 저장하지 못했어요. 백업을 받아 두세요.')}},
  async save(c,item){
    const {id,...data}=item;data.updated=Date.now();
    if(this.mode==='server'){
      try{if(id){await this.base.collection(c).doc(id).set(data);return id}const r=await this.base.collection(c).add(data);return r.id}
      catch(e){toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요. 안 쓰는 항목을 지워 주세요.':'저장하지 못했어요. 잠시 후 다시 시도해 주세요.');return null}
    }
    let nid=id;
    if(id){const i=S[c].findIndex(x=>x.id===id);if(i>=0)S[c][i]={id,...data};else S[c].push({id,...data})}
    else{nid='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S[c].push({id:nid,...data})}
    this.persist();schedule();return nid;
  },
  async del(c,id){
    if(this.mode==='server'){try{await this.base.collection(c).doc(id).delete()}catch(e){toast('삭제하지 못했어요.')}return}
    S[c]=S[c].filter(x=>x.id!==id);this.persist();schedule();
  }
};
let rq=false;function schedule(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}

/* ---------- AI ---------- */
function aiErr(e){
  const c=e&&e.code;
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){aiOff=true;return 'Claude 사용이 허용되지 않아 AI 기능을 쓸 수 없어요.'}
  if(c==='rate_limited')return '요청이 많아요. 잠시 후 다시 눌러 주세요.';
  if(c==='invalid_json')return '답을 정리하지 못했어요. 한 번 더 눌러 주세요.';
  if(c==='session_expired')return '다시 로그인해 주세요.';
  if(c==='refused')return '이 내용으로는 답을 받을 수 없어요. 입력을 바꿔 보세요.';
  if(c==='cancelled')return '';
  return '연결이 잠시 끊겼어요. 다시 시도해 주세요.';
}
const aiReady=()=>!!ai&&!aiOff;
async function askJSON(p,o={}){if(!ai)throw{code:'not_granted'};return ai.json(p,{modelTier:'default',...o})}
const aiNote=()=>!ai?'<p class="note">AI 추천은 Claude 안에서 여는 버전에서만 쓸 수 있어요. 나머지 기능은 모두 쓸 수 있어요.</p>':aiOff?'<p class="note">Claude 사용이 허용되지 않아 AI 기능이 꺼져 있어요.</p>':'';
const thinking=t=>`<div class="thinking"><i></i><i></i><i></i>${t}</div>`;
const storySummary=(n=12)=>S.stories.slice(0,n).map(s=>`- ${s.title}${s.org?' ('+s.org+')':''}: ${[s.s,s.a,s.r].filter(Boolean).join(' / ').slice(0,220)}`).join('\n')||'(아직 없음)';

/* ---------- derived ---------- */
function nextOf(a){
  const c=[];const t=todayStr();const pre=['관심','작성중'].includes(a.status||'관심');
  if(pre){if(okDate(a.startDate)&&a.startDate>=t)c.push([a.startDate,'접수 시작']);if(okDate(a.deadline))c.push([a.deadline,'서류 마감'])}
  if(['포기','불합격','최종합격'].includes(a.status))return null;
  if(okDate(a.testDate)&&a.testDate>=t)c.push([a.testDate,'필기·인적성']);
  if(okDate(a.interviewDate)&&a.interviewDate>=t)c.push([a.interviewDate,'면접']);
  if(okDate(a.resultDate)&&a.resultDate>=t)c.push([a.resultDate,'결과 발표']);
  c.sort((x,y)=>x[0].localeCompare(y[0]));
  return c.find(x=>x[0]>=t)||(pre&&c.length?c[c.length-1]:null);
}
function allEvents(){
  const ev=[];
  for(const a of S.apps){
    const dead=['포기','불합격'].includes(a.status);
    if(okDate(a.startDate))ev.push({date:a.startDate,kind:'start',title:a.company,sub:'접수 시작'+(a.role?' · '+a.role:''),ref:'apps:'+a.id,dim:dead});
    if(okDate(a.deadline))ev.push({date:a.deadline,kind:'due',title:a.company,sub:'서류 마감'+(a.role?' · '+a.role:''),ref:'apps:'+a.id,dim:dead||APPLIED.includes(a.status)});
    if(okDate(a.testDate))ev.push({date:a.testDate,kind:'stage',title:a.company,sub:'필기·인적성',ref:'apps:'+a.id,dim:dead});
    if(okDate(a.interviewDate))ev.push({date:a.interviewDate,kind:'stage',title:a.company,sub:'면접',ref:'apps:'+a.id,dim:dead});
    if(okDate(a.resultDate))ev.push({date:a.resultDate,kind:'stage',title:a.company,sub:'결과 발표',ref:'apps:'+a.id});
  }
  for(const s of S.specs){
    if(okDate(s.examDate))ev.push({date:s.examDate,kind:'exam',title:s.name,sub:'시험',ref:'specs:'+s.id});
    if(okDate(s.expiry))ev.push({date:s.expiry,kind:'exam',title:s.name,sub:'유효기간 만료',ref:'specs:'+s.id});
  }
  for(const e of S.events)if(okDate(e.date))ev.push({date:e.date,kind:'personal',title:e.title,sub:e.memo||'개인 일정',ref:'events:'+e.id});
  return ev.sort((a,b)=>a.date.localeCompare(b.date)||KORD.indexOf(a.kind)-KORD.indexOf(b.kind));
}
function appStats(){
  const a=S.apps;const applied=a.filter(x=>APPLIED.includes(x.status)).length;const passed=a.filter(x=>PASSED.includes(x.status)).length;
  return{total:a.length,active:a.filter(x=>ACTIVE.includes(x.status||'관심')).length,applied,passed,offer:a.filter(x=>x.status==='최종합격').length,rate:applied?Math.round(passed/applied*100):null};
}

/* ---------- view state ---------- */
let page=lsGet('jn_page','home');if(!ALLP.some(p=>p.id===page))page='home';
{const h=(location.hash||'').slice(1);if(ALLP.some(p=>p.id===h))page=h}
let appView=lsGet('jn_appview','list'), appFilter='진행 중', appQ='';
let calY=new Date().getFullYear(), calM=new Date().getMonth(), calSel=todayStr();
let tagFilter=null, essayId=null;
const F={kw:arr(lsGet('jn_kw',[])).slice(0,8),cond:'',roles:null,rolesBusy:false,rolesErr:'',paste:'',url:'',posts:null,postBusy:false,postErr:'',mkEssays:true};
const D={text:'',target:'',ideas:null,busy:false,err:''};
const EA={forId:null,mode:'match',list:null,fb:null,busy:false,err:''};
const QA={appId:'',list:null,busy:false,err:''};
let tSec=60,tLeft=60,tRun=null;
{const fs=lsGet('jn_fs','m');if(fs!=='m')document.documentElement.dataset.fs=fs}

/* ---------- shell ---------- */
function navCounts(){return{apps:S.apps.filter(a=>ACTIVE.includes(a.status||'관심')).length,essays:S.essays.length,stories:S.stories.length,specs:S.specs.length,qs:S.qs.length}}

const FEED={list:null,updated:null,err:'',loading:false,mode:lsGet('jn_feedmode','rec'),onlyNew:false,career:''};
const FEED_SEEN=lsGet('jn_feed_seen',0);
async function loadFeed(force){
  if(FEED.loading||(FEED.list&&!force))return;
  FEED.loading=true;FEED.err='';
  if(!FEED.list){const c=lsGet('jn_feed',null);if(c){FEED.list=arr(c.postings);FEED.updated=c.updated}}
  if(page==='find')render(true);
  let ok=false;
  for(const u of ['postings.json?t='+Date.now(),'https://raw.githubusercontent.com/nakyoung-naya/dfddf/main/postings.json']){
    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const j=await r.json();FEED.list=arr(j.postings);FEED.updated=j.updated;lsSet('jn_feed',{postings:FEED.list,updated:FEED.updated});ok=true;break}catch(e){}
  }
  if(!ok&&!FEED.list)FEED.err='공고를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';
  if(ok)lsSet('jn_feed_seen',Date.now());
  FEED.loading=false;if(page==='find')render(true);
}
function scorePost(p,kws){
  const t=((p.title||'')+' '+(p.duties||'')+' '+(p.desc||'')).toLowerCase(),c=(p.company||'').toLowerCase();let s=0;const hit=[];
  for(const k of kws){const q=k.toLowerCase();let w=0;if(t.includes(q))w+=3;if(c.includes(q))w+=2;if(w){s+=w;hit.push(k)}}
  return{s,hit};
}
/* ---------- 자소설닷컴 공고 붙여넣기 (AI 없이) ---------- */
const PASTE={text:'',url:'',res:null,err:''};
function parsePasted(txt){
  const lines=txt.split(/\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
  const pad2=n=>String(n).padStart(2,'0');const yNow=new Date().getFullYear();const dates=[];
  const re=/(?:(\d{4})\s*[년.\-/]\s*)?(\d{1,2})\s*[월.\-/]\s*(\d{1,2})\s*일?(?:\s*\([^)]*\))?\s*(\d{1,2}:\d{2})?/g;let m;
  for(const ln of lines){if(dates.length>=2)break;if(!/(접수|기간|마감|시작|~|부터|까지|\d{4}년|\d{1,2}월)/.test(ln))continue;re.lastIndex=0;
    while((m=re.exec(ln))&&dates.length<2){const mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)continue;dates.push({date:`${m[1]||yNow}-${pad2(mo)}-${pad2(d)}`,time:m[4]||''})}}
  let start=dates[0]||null,end=dates[1]||null;if(start&&!end){end=start;start=null}
  const ti=lines.findIndex(l=>l.length<90&&/(채용|모집|공채|인턴|신입)/.test(l));
  const title=ti>=0?lines[ti]:(lines[0]||'');
  let company='';const cm=title.match(/^(.+?)\s*(?:채용공고|채용|\d{4}년?|20\d\d|하반기|상반기|신입|경력|공개)/);
  if(cm&&cm[1].length<=25)company=cm[1].replace(/[\[\]()]/g,'').trim();
  if(!company&&ti>0&&lines[ti-1].length<=25&&!/\d/.test(lines[ti-1]))company=lines[ti-1];
  const qs=[];const seen=new Set();
  for(const ln of lines){if(ln.length<12||ln.length>400)continue;
    const lim=ln.match(/(\d{3,4})\s*자/);const isQ=/(기술|작성|서술|설명|기재|말씀|소개)(해|하여|하)?\s*(주십시오|주세요|주시기|바랍니다|하시오|하세요)|\?$/.test(ln);
    if((lim&&isQ)||(isQ&&/^(\d+[.)]|Q\d|문항)/.test(ln))){const q=ln.replace(/^(\d+[.)]\s*|Q\d+[.:)]?\s*|문항\s*\d*[.:]?\s*)/,'').trim();if(!seen.has(q)){seen.add(q);qs.push({q,limit:lim?+lim[1]:0})}}}
  return{company,role:title.replace(company,'').replace(/^[\s\-:|]+/,'').trim()||title,start:start?.date||'',end:end?.date||'',endTime:end?.time||'',qs};
}

  const ae=document.activeElement;const v=document.getElementById('view');
  if(!force&&lastPage===page&&ae&&v.contains(ae)&&(ae.tagName==='TEXTAREA'||(ae.tagName==='INPUT'&&!['checkbox','radio','file'].includes(ae.type))))return;
  lastPage=page;
  v.innerHTML=({home:pHome,cal:pCal,find:pFind,apps:pApps,stories:pStories,essays:pEssays,specs:pSpecs,qs:pQs,settings:pSettings}[page])();
  if(page==='essays')bindEssay();
}

let eTimer=null;
function bindEssay(){
  const e=S.essays.find(x=>x.id===essayId);if(!e)return;
  const $=id=>document.getElementById(id);
  const upd=()=>{
    const c=cnt($('e_body').value),lim=Number($('e_limit').value)||0,pct=lim?Math.min(100,c.all/lim*100):0;
    const over=lim&&c.all>lim;const col=over?'var(--due)':pct>=90?'var(--ok)':'var(--accent)';
    $('counter').innerHTML=`<span>공백 포함 <b class="num">${c.all.toLocaleString()}</b>${lim?` / <span class="num">${lim.toLocaleString()}</span>`:''}</span><span>공백 제외 <b class="num">${c.noSp.toLocaleString()}</b></span><span>바이트 <b class="num">${c.bytes.toLocaleString()}</b></span>${lim?`<span style="color:${col};font-weight:700">${over?`${(c.all-lim).toLocaleString()}자 초과`:`${(lim-c.all).toLocaleString()}자 남음`}</span><div class="bar"><div style="width:${pct}%;background:${col}"></div></div>`:''}`;
  };
  const queue=()=>{upd();$('saved').textContent='작성 중…';clearTimeout(eTimer);const id=essayId;eTimer=setTimeout(async()=>{
    if(id!==essayId||!$('e_body'))return;const cur=S.essays.find(x=>x.id===id)||{};
    await Store.save('essays',{...cur,id,company:$('e_company').value,question:$('e_q').value,body:$('e_body').value,limit:Number($('e_limit').value)||0});
    if($('saved'))$('saved').textContent=Store.mode==='memory'?'미리보기라 저장되지 않아요':'저장됨';
  },800)};
  ['e_body','e_q','e_company','e_limit'].forEach(id=>$(id).addEventListener('input',queue));
  upd();
}

/* ---------- modals ---------- */
function modal(title,body,onSave,onDelete,onMount){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="ov" id="ov"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><span class="sp"></span><button type="button" class="xbtn" id="mx" aria-label="닫기">×</button></div><div class="mb">${body}</div>
   <div class="mf">${onDelete?`<button type="button" class="btn del" id="mdel">삭제</button>`:''}<span class="sp"></span><button type="button" class="btn sec" id="mcancel">취소</button><button class="btn" type="submit">저장</button></div></form></div>`;
  const close=()=>{root.innerHTML='';render(true)};
  ['mcancel','mx'].forEach(id=>document.getElementById(id).onclick=close);
  document.getElementById('ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')close()});
  document.getElementById('mform').addEventListener('submit',async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));await onSave(fd);close();toast('저장했어요')});
  if(onDelete){const d=document.getElementById('mdel');d.onclick=async()=>{if(d.dataset.sure){await onDelete();close();toast('삭제했어요')}else{d.dataset.sure=1;d.textContent='한 번 더 누르면 삭제'}}}
  onMount&&onMount(root);
  if(matchMedia('(min-width:901px)').matches){const f=root.querySelector('.mb input:not([type=checkbox]),.mb textarea');f&&f.focus()}
}

const NEWS={data:null,loading:null};
function loadNews(){
  if(NEWS.loading)return NEWS.loading;
  if(!NEWS.data){const c=lsGet('jn_news',null);if(c)NEWS.data=c}
  NEWS.loading=(async()=>{for(const u of ['news.json?t='+Date.now(),'https://raw.githubusercontent.com/nakyoung-naya/dfddf/main/news.json']){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const j=await r.json();NEWS.data=j;lsSet('jn_news',j);break}catch(e){}}NEWS.loading=null})();
  return NEWS.loading;
}
const cleanCo=n=>(n||'').replace(/\(주\)|㈜|주식회사|\s+/g,'').trim();
function newsFor(co){const c=NEWS.data&&NEWS.data.companies;const k=cleanCo(co);if(!c||!k)return null;if(c[k])return c[k];const hit=Object.keys(c).find(n=>n.includes(k)||k.includes(n));return hit?c[hit]:null}
function newsHtml(co){
  if(!(co||'').trim())return '<span class="note">회사 이름을 적으면 최근 뉴스를 보여 줘요.</span>';
  if(!NEWS.data)return '<span class="note">뉴스를 불러오는 중이에요…</span>';
  const n=newsFor(co);
  if(!n)return `<span class="note">모아 둔 뉴스가 없어요. 위 ‘최신 뉴스’ 바로가기로 찾아보세요. 매일 자동으로 받아 보려면 설정·백업의 ‘뉴스 받을 회사 목록’을 GitHub companies.txt에 붙여넣으세요.</span>`;
  return `<div class="list">${n.items.map(i=>`<a class="li" href="${esc(i.url)}" target="_blank" rel="noopener" style="grid-template-columns:52px minmax(0,1fr);text-decoration:none;color:inherit"><span class="date num">${md(i.date)}</span><span><strong style="white-space:normal">${esc(i.title)}</strong><small>${esc(i.source)}</small></span></a>`).join('')}</div>
  <button type="button" class="btn sec sm" id="a_newsadd" style="margin-top:8px">이 뉴스 제목을 사업·이슈 칸에 넣기</button>`;
}

function extractValues(txt){const t=txt.replace(/\s+/g,' ');return VALUE_DICT.map(([k,words,tags])=>({k,tags,n:words.reduce((s,w)=>s+(t.split(w).length-1),0)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n)}
function researchLinks(co){
  co=(co||'').trim();if(!co)return '<span class="note">회사 이름을 적으면 바로가기가 생겨요.</span>';
  const q=encodeURIComponent;
  const L=[['인재상·핵심가치',`https://www.google.com/search?q=${q(co+' 인재상 핵심가치')}`],['채용 홈페이지',`https://www.google.com/search?q=${q(co+' 채용 홈페이지')}`],
    ['최신 뉴스',`https://search.naver.com/search.naver?where=news&sort=1&query=${q(co)}`],['사업보고서(DART)',`https://www.google.com/search?q=${q(co+' 사업보고서 dart.fss.or.kr')}`],
    ['기업 리뷰(잡플래닛)',`https://www.jobplanet.co.kr/search?query=${q(co)}`],['합격 자소서·후기',`https://www.google.com/search?q=${q(co+' 합격 자소서 면접 후기')}`]];
  return L.map(([l,u])=>`<a class="btn sec sm" href="${u}" target="_blank" rel="noopener">${l} ↗</a>`).join('');
}

  if(d.feednew!==undefined){FEED.onlyNew=!FEED.onlyNew;return render(true)}
  if(d.feedrefresh!==undefined)return loadFeed(true);
  if(d.addfeed){const p=arr(FEED.list).find(x=>x.id===d.addfeed);if(!p)return;t.disabled=true;await Store.save('apps',{company:p.company||'회사명 확인',role:p.title||'',status:'관심',startDate:okDate(p.start)?p.start:'',deadline:okDate(p.end)?p.end:'',link:p.url,memo:[p.duties,p.endTime&&('마감 시각 '+p.endTime)].filter(Boolean).join('\n'),check:{},created:Date.now()});toast(`${p.company} 추가했어요`);return render(true)}
  if(d.hidebanner!==undefined){lsSet('jn_hidebanner',true);return render(true)}
  if(d.ref)return openRef(d.ref);
  if(d.editApp)return appModal(S.apps.find(a=>a.id===d.editApp));
  if(d.newApp!==undefined)return appModal();
  if(d.newEvent!==undefined)return eventModal(null,d.newEvent||calSel);
  if(d.deltodo)return Store.del('todos',d.deltodo);
  if(d.cal!==undefined){const k=Number(d.cal);if(k===0){const n=new Date();calY=n.getFullYear();calM=n.getMonth();calSel=todayStr()}else{const n=new Date(calY,calM+k,1);calY=n.getFullYear();calM=n.getMonth()}return render(true)}
  if(d.day){calSel=d.day;const dd=toD(d.day);if(dd.getMonth()!==calM){calY=dd.getFullYear();calM=dd.getMonth()}return render(true)}
  if(d.appview){appView=d.appview;lsSet('jn_appview',appView);return render(true)}
  if(d.appfilter){appFilter=d.appfilter;return render(true)}
  if(d.kwadd){addKw(d.kwadd);return render(true)}
  if(d.kwdel!==undefined){F.kw.splice(Number(d.kwdel),1);lsSet('jn_kw',F.kw);return render(true)}
  if(d.recroles!==undefined){F.cond=document.getElementById('cond')?.value||F.cond;return recRoles()}
  if(d.addco){if(d.added!==undefined)return;t.disabled=true;await Store.save('apps',{company:d.addco,role:d.role,status:'관심',check:{},memo:'공고 찾기 추천에서 추가',created:Date.now()});toast(`${d.addco} 추가했어요`);return render(true)}
  if(d.copykw){try{await navigator.clipboard.writeText(d.copykw);toast('검색어를 복사했어요')}catch(err){toast('검색어: '+d.copykw)}return}
  if(d.parse!==undefined){F.paste=document.getElementById('ptext').value;F.url=document.getElementById('purl').value.trim();return parsePosting()}
  if(d.addpost!==undefined){t.disabled=true;return addPost(Number(d.addpost))}
  if(d.discover!==undefined){D.text=document.getElementById('dtext').value;D.target=document.getElementById('dtarget').value;return discover()}
  if(d.takeidea!==undefined){const x=D.ideas[Number(d.takeidea)];if(!x||x._taken)return;x._taken=true;await Store.save('stories',{title:x.title,org:x.org||'',period:'',s:'',t:'',a:'',r:'',memo:[x.angle,x.ask&&('채울 질문: '+x.ask)].filter(Boolean).join('\n'),tags:arr(x.tags).filter(z=>TAGS.includes(z)),created:Date.now()});toast('경험 은행에 담았어요');return render(true)}
  if(d.tag!==undefined){tagFilter=d.tag||null;return render(true)}
  if(d.editStory)return storyModal(S.stories.find(s=>s.id===d.editStory));
  if(d.newStory!==undefined)return storyModal();
  if(d.essay){essayId=d.essay;return render(true)}
  if(d.newEssay!==undefined){const cur=S.essays.find(x=>x.id===essayId);const id=await Store.save('essays',{company:cur?.company||'',question:'',body:'',limit:0,created:Date.now()});if(id)essayId=id;return render(true)}
  if(d.delEssay!==undefined){if(t.dataset.sure){clearTimeout(eTimer);await Store.del('essays',essayId);essayId=null;render(true)}else{t.dataset.sure=1;t.textContent='한 번 더 누르면 삭제'}return}
  if(d.copyEssay!==undefined){const tx=document.getElementById('e_body');try{await navigator.clipboard.writeText(tx.value);toast('복사했어요')}catch(err){tx.focus();tx.select();toast('선택했어요. Ctrl+C로 복사하세요')}return}
  if(d.matchexp!==undefined)return matchExp();
  if(d.feedback!==undefined)return feedback();
  if(d.newSpec!==undefined)return specModal();
  if(d.editSpec)return specModal(S.specs.find(s=>s.id===d.editSpec));
  if(d.newQ!==undefined)return qModal();
  if(d.editQ)return qModal(S.qs.find(q=>q.id===d.editQ));
  if(d.basicqs!==undefined){const have=new Set(S.qs.map(q=>q.q));let n=0;for(const [q,c] of BASIC_QS)if(!have.has(q)){await Store.save('qs',{q,category:c,answer:'',practiced:0,created:Date.now()});n++}toast(n?`기본 질문 ${n}개를 넣었어요`:'이미 모두 들어 있어요');return}
  if(d.genqs!==undefined)return genQs();
  if(d.takeq!==undefined){const x=QA.list[Number(d.takeq)];if(!x||x._taken)return;x._taken=true;const a=S.apps.find(z=>z.id===QA.appId);await Store.save('qs',{q:x.q,category:QCAT.includes(x.category)?x.category:'회사별',company:a?.company||'',answer:x.intent?('의도: '+x.intent):'',practiced:0,created:Date.now()});toast('질문을 담았어요');return render(true)}
  if(d.practice){const q=S.qs.find(x=>x.id===d.practice);await Store.save('qs',{...q,practiced:(q.practiced||0)+1});return}
  if(d.timer!==undefined){if(tRun){clearInterval(tRun);tRun=null}else{if(tLeft<=0)tLeft=tSec;tRun=setInterval(()=>{tLeft--;const el=document.getElementById('tdisp');if(el){el.textContent=fmtT(Math.max(0,tLeft));el.style.color=tLeft<=10?'var(--due)':''}if(tLeft<=0){clearInterval(tRun);tRun=null;toast('시간 끝!');render(true)}},1000)}return render(true)}
  if(d.treset!==undefined){clearInterval(tRun);tRun=null;tLeft=tSec;return render(true)}
  if(d.fs){if(d.fs==='m')delete document.documentElement.dataset.fs;else document.documentElement.dataset.fs=d.fs;lsSet('jn_fs',d.fs);return render(true)}
  if(d.export!==undefined)return exportData();
  if(d.wipe!==undefined){if(t.dataset.sure){for(const c of COLS)for(const x of [...S[c]])await Store.del(c,x.id);toast('모든 기록을 지웠어요');render(true)}else{t.dataset.sure=1;t.textContent='정말 지우려면 한 번 더 누르세요'}return}
});
view.addEventListener('submit',async e=>{if(e.target.id==='todo-form'){e.preventDefault();const i=document.getElementById('todo_in');const v=i.value.trim();if(!v)return;i.value='';await Store.save('todos',{text:v,done:false,created:Date.now()});render(true);document.getElementById('todo_in')?.focus()}});
view.addEventListener('keydown',e=>{
  if(e.target.id==='kwin'&&(e.key==='Enter'||e.key===',')&&!e.isComposing){e.preventDefault();addKw(e.target.value);render(true);document.getElementById('kwin')?.focus();return}
  if(e.target.id==='kwin'&&e.key==='Backspace'&&!e.target.value&&F.kw.length){F.kw.pop();lsSet('jn_kw',F.kw);render(true);document.getElementById('kwin')?.focus();return}
  if(e.key==='Enter'&&e.target.dataset){if(e.target.dataset.editApp)appModal(S.apps.find(a=>a.id===e.target.dataset.editApp));else if(e.target.dataset.editSpec)specModal(S.specs.find(a=>a.id===e.target.dataset.editSpec))}
});
let qT=null;
view.addEventListener('input',e=>{const id=e.target.id,v=e.target.value;
  if(id==='cond')F.cond=v;if(id==='ptext')F.paste=v;if(id==='purl')F.url=v;if(id==='dtext')D.text=v;if(id==='dtarget')D.target=v;
  if(id==='appq'&&!e.isComposing){appQ=v;clearTimeout(qT);qT=setTimeout(()=>{const n0=document.getElementById('appq');const pos=n0?n0.selectionStart:v.length;render(true);const n=document.getElementById('appq');if(n){n.focus();n.setSelectionRange(pos,pos)}},250)}});
view.addEventListener('compositionend',e=>{if(e.target.id==='appq')e.target.dispatchEvent(new Event('input',{bubbles:true}))});
view.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.todo){const x=S.todos.find(z=>z.id===t.dataset.todo);if(x)await Store.save('todos',{...x,done:t.checked});return}
  if(t.dataset.status){const x=S.apps.find(a=>a.id===t.dataset.status);if(!x)return;const d={...x,status:t.value};if(APPLIED.includes(d.status)&&!d.appliedDate)d.appliedDate=todayStr();await Store.save('apps',d);toast(`${x.company} → ${t.value}`);return}
  if(t.id==='tsel'){tSec=Number(t.value);clearInterval(tRun);tRun=null;tLeft=tSec;return render(true)}
  if(t.id==='mkess')F.mkEssays=t.checked;
  if(t.id==='qa_app'){QA.appId=t.value;QA.list=null;return render(true)}
  if(t.id==='importf'&&t.files[0])importData(t.files[0]);
});

render(true);
Store.init();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

</body>
